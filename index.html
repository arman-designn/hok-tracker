<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchup Matrix Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Mode Matrix Cell Styling */
        .cell-good { background-color: #064e3b; color: #6ee7b7; font-weight: 600; } 
        .cell-okay { background-color: #713f12; color: #fde047; font-weight: 600; } 
        .cell-bad { background-color: #7f1d1d; color: #fca5a5; font-weight: 600; }  
        .cell-empty { background-color: #1f2937; color: #6b7280; }                 
        
        th, td { border: 1px solid #4b5563; text-align: center; min-width: 80px; height: 60px; padding: 4px; }
        th { background-color: #374151; font-weight: bold; color: #f3f4f6; }       
        
        /* Tab transitions */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Custom Scrollbar for Dark Mode */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100 h-screen flex flex-col">

    <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col p-4 md:p-8">
        
        <header class="mb-6 flex justify-between items-end border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-white">Omni-Role Matchup Analytics</h1>
                <p class="text-gray-400 mt-2">Quantitative tracking and visualization across multiple roles.</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <label for="globalRole" class="text-sm font-medium text-gray-300">Active Role:</label>
                <select id="globalRole" class="bg-gray-800 border border-gray-600 text-white rounded px-4 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none transition-shadow">
                    <option value="Clash Lane">Clash Lane</option>
                    <option value="Jungle">Jungle</option>
                    <option value="Midlane">Midlane</option>
                    <option value="ADC">ADC</option>
                    <option value="Roamer">Roamer</option>
                </select>
            </div>
        </header>

        <nav class="flex space-x-2 border-b border-gray-700 mb-6" aria-label="Tabs">
            <button onclick="switchTab('tab-log', this)" class="tab-btn active px-4 py-3 text-sm font-medium border-b-2 border-purple-500 text-purple-400 transition-colors">
                Data Entry
            </button>
            <button onclick="switchTab('tab-matrix', this)" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500 transition-colors">
                Performance Matrix
            </button>
        </nav>

        <div class="flex-1 bg-gray-800 rounded-lg shadow-lg border border-gray-700 p-6 relative overflow-hidden">
            
            <div id="tab-log" class="tab-content active h-full overflow-y-auto pr-2">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <div>
                        <h2 class="text-xl font-semibold mb-6 text-white">Log New Matchup</h2>
                        <form id="matchupForm" class="max-w-md space-y-5">
                            
                            <datalist id="heroDatabaseList"></datalist>

                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">My Pick (Y-Axis)</label>
                                <input type="text" id="myPick" list="heroDatabaseList" required autocomplete="off" class="w-full bg-gray-700 border border-gray-600 text-white rounded px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition-shadow" placeholder="Select or type a new hero...">
                            </div>
                            
                            <div class="flex items-center justify-center py-2">
                                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest bg-gray-900 px-3 py-1 rounded-full border border-gray-700">Versus</span>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Enemy Pick (X-Axis)</label>
                                <input type="text" id="enemyPick" list="heroDatabaseList" required autocomplete="off" class="w-full bg-gray-700 border border-gray-600 text-white rounded px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition-shadow" placeholder="Select or type a new hero...">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-1">Result</label>
                                <div class="grid grid-cols-3 gap-3">
                                    <label class="cursor-pointer">
                                        <input type="radio" name="matchResult" value="win" class="peer sr-only" required>
                                        <div class="text-center px-2 py-3 border border-gray-600 bg-gray-700 rounded peer-checked:bg-green-900 peer-checked:border-green-500 peer-checked:text-green-300 text-gray-300 font-semibold transition-colors">Win</div>
                                    </label>
                                    <label class="cursor-pointer">
                                        <input type="radio" name="matchResult" value="draw" class="peer sr-only">
                                        <div class="text-center px-2 py-3 border border-gray-600 bg-gray-700 rounded peer-checked:bg-yellow-900 peer-checked:border-yellow-500 peer-checked:text-yellow-300 text-gray-300 font-semibold transition-colors">Draw</div>
                                    </label>
                                    <label class="cursor-pointer">
                                        <input type="radio" name="matchResult" value="loss" class="peer sr-only">
                                        <div class="text-center px-2 py-3 border border-gray-600 bg-gray-700 rounded peer-checked:bg-red-900 peer-checked:border-red-500 peer-checked:text-red-300 text-gray-300 font-semibold transition-colors">Loss</div>
                                    </label>
                                </div>
                            </div>

                            <div class="pt-4 flex gap-4">
                                <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-6 rounded transition-colors shadow-md">
                                    Append Data
                                </button>
                                <button type="button" id="clearData" class="text-red-400 border border-red-900 hover:bg-red-900/30 font-medium py-3 px-6 rounded transition-colors" title="Delete all local data">
                                    Clear Data
                                </button>
                            </div>
                        </form>
                    </div>

                    <div>
                        <h2 class="text-xl font-semibold mb-6 text-white">Hero Customization</h2>
                        
                        <div class="max-w-md bg-gray-900 p-4 rounded border border-gray-700 mb-8">
                            <h3 class="text-sm font-semibold text-gray-400 mb-3 uppercase tracking-wider">Set Hero Portrait</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-1">Target Hero</label>
                                    <input type="text" id="portraitHero" list="heroDatabaseList" class="w-full bg-gray-700 border border-gray-600 text-white rounded px-3 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="Select hero...">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-1">Image File (Square recommended)</label>
                                    <input type="file" id="portraitFile" accept="image/*" class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500 cursor-pointer border border-gray-600 bg-gray-700 rounded">
                                </div>
                                <button type="button" onclick="savePortrait()" class="w-full bg-gray-700 border border-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded transition-colors shadow-md">
                                    Upload & Assign Portrait
                                </button>
                            </div>
                        </div>

                        <div class="max-w-md pt-6 border-t border-gray-700">
                            <h3 class="text-sm font-semibold text-gray-400 mb-3 uppercase tracking-wider">Database Management</h3>
                            <div class="flex gap-4">
                                <button type="button" onclick="exportData()" class="flex-1 border border-gray-600 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-medium py-2 px-4 rounded transition-colors">
                                    Export Backup
                                </button>
                                <button type="button" onclick="document.getElementById('importFile').click()" class="flex-1 border border-gray-600 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-medium py-2 px-4 rounded transition-colors">
                                    Import Backup
                                </button>
                                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                            </div>
                            <p class="text-xs text-gray-500 mt-2">Export your data to preserve logged matchups and assigned images.</p>
                        </div>

                    </div>
                </div>
                
                <div id="statusMessage" class="mt-4 h-6 text-sm font-medium text-center transition-opacity opacity-0"></div>
            </div>

            <div id="tab-matrix" class="tab-content h-full flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-white" id="matrixTitle">Matchup Matrix</h2>
                    <p class="text-sm text-gray-400">Row = My Pick, Column = Enemy Pick</p>
                </div>
                <div class="overflow-auto flex-1 border border-gray-700 rounded bg-gray-800">
                    <div id="matrixContainer" class="min-w-max">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // System State Initialization
        let matchData = JSON.parse(localStorage.getItem('matchupDataV2')) || [];
        let heroImages = JSON.parse(localStorage.getItem('heroImages')) || {};
        
        let heroDB = JSON.parse(localStorage.getItem('heroDB')) || {
            'Clash Lane': [], 'Jungle': [], 'Midlane': [], 'ADC': [], 'Roamer': []
        };

        const form = document.getElementById('matchupForm');
        const clearBtn = document.getElementById('clearData');
        const matrixContainer = document.getElementById('matrixContainer');
        const statusMessage = document.getElementById('statusMessage');
        const roleSelector = document.getElementById('globalRole');
        const heroDatalist = document.getElementById('heroDatabaseList');
        const matrixTitle = document.getElementById('matrixTitle');

        const myPickInput = document.getElementById('myPick');
        const enemyPickInput = document.getElementById('enemyPick');

        // Initialize Application State
        updateDatalist();
        renderMatrix();

        // Standardize Name Capitalization
        function formatName(name) {
            if (!name) return '';
            return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        }

        // Event Listener: Role Selection Change
        roleSelector.addEventListener('change', function() {
            updateDatalist();
            renderMatrix();
            myPickInput.value = '';
            enemyPickInput.value = '';
        });

        // Tab Navigation Logic
        function switchTab(targetId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-purple-500', 'text-purple-400');
                btn.classList.add('border-transparent', 'text-gray-400');
            });
            btnElement.classList.remove('border-transparent', 'text-gray-400');
            btnElement.classList.add('border-purple-500', 'text-purple-400');

            if (targetId === 'tab-matrix') renderMatrix();
        }

        // Display temporary status messages
        function showStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = `mt-4 h-6 text-sm font-medium text-center transition-opacity opacity-100 ${isError ? 'text-red-400' : 'text-green-400'}`;
            setTimeout(() => { statusMessage.classList.replace('opacity-100', 'opacity-0'); }, 3000);
        }

        // Updates the HTML <datalist> with heroes specific to the currently selected role
        function updateDatalist() {
            const currentRole = roleSelector.value;
            const heroes = heroDB[currentRole] || [];
            
            heroDatalist.innerHTML = '';
            // Use a Set to ensure unique values across roles if cross-pollination happens
            const uniqueHeroes = [...new Set(Object.values(heroDB).flat())];
            
            uniqueHeroes.sort().forEach(hero => {
                const option = document.createElement('option');
                option.value = hero;
                heroDatalist.appendChild(option);
            });
        }

        // Append new heroes to the database dynamically
        function ensureHeroInDatabase(role, heroName) {
            if (!heroName) return;
            const formattedName = formatName(heroName);
            if (!heroDB[role].includes(formattedName)) {
                heroDB[role].push(formattedName);
                localStorage.setItem('heroDB', JSON.stringify(heroDB));
                updateDatalist(); 
            }
        }

        // Image Upload & Formatting Logic
        function savePortrait() {
            const heroNameRaw = document.getElementById('portraitHero').value.trim();
            const fileInput = document.getElementById('portraitFile');
            
            if (!heroNameRaw) {
                showStatus('Please specify a target hero.', true);
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                showStatus('Please select an image file.', true);
                return;
            }

            const heroName = formatName(heroNameRaw);
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                heroImages[heroName] = e.target.result; // Saves as Base64 Data URL
                localStorage.setItem('heroImages', JSON.stringify(heroImages));
                
                // Ensure hero exists in DB context just in case
                ensureHeroInDatabase(roleSelector.value, heroName);
                
                showStatus(`Portrait successfully assigned to ${heroName}.`);
                renderMatrix();
                
                // Reset inputs
                document.getElementById('portraitHero').value = '';
                fileInput.value = '';
            };

            reader.onerror = function() {
                showStatus('Error processing image file.', true);
            };
            
            reader.readAsDataURL(file);
        }

        // Immediately register heroes when typing finishes, so the other box can access it
        myPickInput.addEventListener('blur', function() { ensureHeroInDatabase(roleSelector.value, this.value.trim()); });
        enemyPickInput.addEventListener('blur', function() { ensureHeroInDatabase(roleSelector.value, this.value.trim()); });

        // Event Listener: Form Submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentRole = roleSelector.value;
            const myPickRaw = myPickInput.value.trim();
            const enemyPickRaw = enemyPickInput.value.trim();
            const resultElement = document.querySelector('input[name="matchResult"]:checked');

            if (!resultElement) {
                showStatus('Please select a match result.', true);
                return;
            }

            const payload = {
                role: currentRole,
                myPick: formatName(myPickRaw),
                enemyPick: formatName(enemyPickRaw),
                result: resultElement.value
            };

            ensureHeroInDatabase(currentRole, payload.myPick);
            ensureHeroInDatabase(currentRole, payload.enemyPick);

            matchData.push(payload);
            localStorage.setItem('matchupDataV2', JSON.stringify(matchData));
            
            showStatus(`Logged [${currentRole}]: ${payload.myPick} vs ${payload.enemyPick} (${payload.result.toUpperCase()})`);
            
            document.querySelectorAll('input[name="matchResult"]').forEach(rb => rb.checked = false);
            
            renderMatrix();
        });

        // Event Listener: Data Clearing
        clearBtn.addEventListener('click', function() {
            if (confirm("Are you certain? This will irrevocably delete your localized dataset, hero database, and assigned portraits.")) {
                matchData = [];
                heroImages = {};
                heroDB = { 'Clash Lane': [], 'Jungle': [], 'Midlane': [], 'ADC': [], 'Roamer': [] };
                localStorage.removeItem('matchupDataV2');
                localStorage.removeItem('heroDB');
                localStorage.removeItem('heroImages');
                updateDatalist();
                renderMatrix();
                showStatus('Dataset, Hero Database, and Portraits cleared.', true);
            }
        });

        // Export Data Logic
        function exportData() {
            const dataToExport = { matchData: matchData, heroDB: heroDB, heroImages: heroImages };
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hok_tracker_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import Data Logic
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.matchData && importedData.heroDB) {
                        matchData = importedData.matchData;
                        heroDB = importedData.heroDB;
                        heroImages = importedData.heroImages || {};
                        
                        localStorage.setItem('matchupDataV2', JSON.stringify(matchData));
                        localStorage.setItem('heroDB', JSON.stringify(heroDB));
                        localStorage.setItem('heroImages', JSON.stringify(heroImages));
                        
                        updateDatalist();
                        renderMatrix();
                        showStatus('Data successfully imported and restored!');
                    } else {
                        showStatus('Error: Invalid backup file format.', true);
                    }
                } catch (error) {
                    showStatus('Error: Could not read backup file.', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Header Formatting Helper
        function generateHeroHeaderHTML(heroName) {
            const imgSrc = heroImages[heroName];
            if (imgSrc) {
                return `
                <div class="flex flex-col items-center justify-center p-1 space-y-1 w-full">
                    <img src="${imgSrc}" class="w-12 h-12 object-cover rounded shadow-md border border-gray-500 bg-gray-800" alt="${heroName}" title="${heroName}">
                    <span class="text-xs font-semibold truncate w-full px-1">${heroName}</span>
                </div>`;
            }
            return `<span class="px-2">${heroName}</span>`;
        }

        // Matrix Generation Logic
        function renderMatrix() {
            const currentRole = roleSelector.value;
            matrixTitle.textContent = `${currentRole} Matrix`;

            const roleMatchData = matchData.filter(d => d.role === currentRole);
            const roleHeroes = heroDB[currentRole] || [];

            if (roleHeroes.length === 0) {
                matrixContainer.innerHTML = `<div class="p-8 text-center text-gray-500 italic">No heroes registered for ${currentRole} yet. Add entries to initialize the matrix.</div>`;
                return;
            }

            const sortedHeroes = [...roleHeroes].sort();

            let tableHTML = '<table class="w-full border-collapse"><thead><tr>';
            tableHTML += '<th class="sticky top-0 left-0 z-20 bg-gray-800 border-gray-600 shadow-[2px_2px_0_#4b5563]">My Pick \\ Enemy</th>';
            
            sortedHeroes.forEach(hero => {
                tableHTML += `<th class="sticky top-0 z-10 bg-gray-700 border-gray-600 min-w-[90px]">${generateHeroHeaderHTML(hero)}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            sortedHeroes.forEach(myHero => {
                tableHTML += `<tr><th class="sticky left-0 z-10 bg-gray-700 text-center border-gray-600 shadow-[2px_0_0_#4b5563] min-w-[90px]">${generateHeroHeaderHTML(myHero)}</th>`;
                
                sortedHeroes.forEach(enemyHero => {
                    const subset = roleMatchData.filter(d => d.myPick === myHero && d.enemyPick === enemyHero);
                    const totalMatches = subset.length;
                    
                    if (totalMatches === 0) {
                        tableHTML += `<td class="cell-empty">-</td>`;
                    } else {
                        const wins = subset.filter(d => d.result === 'win').length;
                        const losses = subset.filter(d => d.result === 'loss').length;
                        const draws = subset.filter(d => d.result === 'draw').length;
                        
                        const winRate = (wins / totalMatches) * 100;
                        
                        let cssClass = 'cell-okay';
                        if (winRate >= 55) cssClass = 'cell-good';
                        if (winRate <= 45) cssClass = 'cell-bad';

                        const recordDisplay = draws > 0 ? `${wins}W-${losses}L-${draws}D` : `${wins}W - ${losses}L`;

                        tableHTML += `<td class="${cssClass}">
                            <div class="text-lg">${Math.round(winRate)}%</div>
                            <div class="text-xs font-normal opacity-75">${recordDisplay}</div>
                        </td>`;
                    }
                });
                tableHTML += '</tr>';
            });

            tableHTML += '</tbody></table>';
            matrixContainer.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
