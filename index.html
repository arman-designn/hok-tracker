<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchup Matrix Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell-good { background-color: #86efac; color: #14532d; font-weight: 600; }
        .cell-okay { background-color: #fef08a; color: #713f12; font-weight: 600; }
        .cell-bad { background-color: #fca5a5; color: #7f1d1d; font-weight: 600; }
        .cell-empty { background-color: #f1f5f9; color: #94a3b8; }
        th, td { border: 1px solid #cbd5e1; text-align: center; min-width: 80px; height: 60px; padding: 4px; }
        th { background-color: #e2e8f0; font-weight: bold; }
        
        /* Tab transitions */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen flex flex-col">

    <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col p-4 md:p-8">
        
        <header class="mb-6">
            <h1 class="text-3xl font-bold">Clash Lane Analytics</h1>
            <p class="text-slate-600 mt-2">Quantitative tracking and visualization.</p>
        </header>

        <nav class="flex space-x-2 border-b border-slate-300 mb-6" aria-label="Tabs">
            <button onclick="switchTab('tab-log', this)" class="tab-btn active px-4 py-3 text-sm font-medium border-b-2 border-blue-600 text-blue-600 transition-colors">
                Data Entry
            </button>
            <button onclick="switchTab('tab-matrix', this)" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 transition-colors">
                Performance Matrix
            </button>
        </nav>

        <div class="flex-1 bg-white rounded-lg shadow-sm border border-slate-200 p-6 relative overflow-hidden">
            
            <div id="tab-log" class="tab-content active h-full">
                <h2 class="text-xl font-semibold mb-6">Log New Matchup</h2>
                <form id="matchupForm" class="max-w-md space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">My Pick (Y-Axis)</label>
                        <input type="text" id="myPick" required class="w-full border border-slate-300 rounded px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow" placeholder="e.g., Lu Bu">
                    </div>
                    
                    <div class="flex items-center justify-center py-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-full border border-slate-200">Versus</span>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Enemy Pick (X-Axis)</label>
                        <input type="text" id="enemyPick" required class="w-full border border-slate-300 rounded px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow" placeholder="e.g., Biron">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Result</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="cursor-pointer">
                                <input type="radio" name="matchResult" value="win" class="peer sr-only" required>
                                <div class="text-center px-4 py-3 border border-slate-300 rounded peer-checked:bg-green-100 peer-checked:border-green-600 peer-checked:text-green-800 font-semibold transition-colors">Win</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="matchResult" value="loss" class="peer sr-only">
                                <div class="text-center px-4 py-3 border border-slate-300 rounded peer-checked:bg-red-100 peer-checked:border-red-600 peer-checked:text-red-800 font-semibold transition-colors">Loss</div>
                            </label>
                        </div>
                    </div>

                    <div class="pt-4 flex gap-4">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded transition-colors">
                            Append Data
                        </button>
                        <button type="button" id="clearData" class="text-red-600 border border-red-200 hover:bg-red-50 font-medium py-3 px-6 rounded transition-colors" title="Delete all local data">
                            Clear Data
                        </button>
                    </div>
                    
                    <div id="statusMessage" class="h-6 text-sm font-medium text-center transition-opacity opacity-0"></div>
                </form>
            </div>

            <div id="tab-matrix" class="tab-content h-full flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Matchup Matrix</h2>
                    <p class="text-sm text-slate-500">Row = My Pick, Column = Enemy Pick</p>
                </div>
                <div class="overflow-auto flex-1 border border-slate-200 rounded">
                    <div id="matrixContainer" class="min-w-max">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // System State Initialization
        let matchData = JSON.parse(localStorage.getItem('matchupData')) || [];
        const form = document.getElementById('matchupForm');
        const clearBtn = document.getElementById('clearData');
        const matrixContainer = document.getElementById('matrixContainer');
        const statusMessage = document.getElementById('statusMessage');

        // Tab Navigation Logic
        function switchTab(targetId, btnElement) {
            // Update active content
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(targetId).classList.add('active');

            // Update active button styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-slate-500');
            });
            btnElement.classList.remove('border-transparent', 'text-slate-500');
            btnElement.classList.add('border-blue-600', 'text-blue-600');

            // Render matrix if switching to visualization tab
            if (targetId === 'tab-matrix') {
                renderMatrix();
            }
        }

        // Display temporary status messages
        function showStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = `h-6 text-sm font-medium text-center transition-opacity opacity-100 ${isError ? 'text-red-600' : 'text-green-600'}`;
            setTimeout(() => { statusMessage.classList.replace('opacity-100', 'opacity-0'); }, 3000);
        }

        // Event Listener: Form Submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const myPickRaw = document.getElementById('myPick').value.trim();
            const enemyPickRaw = document.getElementById('enemyPick').value.trim();
            const resultElement = document.querySelector('input[name="matchResult"]:checked');

            if (!resultElement) {
                showStatus('Please select a match result.', true);
                return;
            }

            // Standardize string formatting
            const payload = {
                myPick: myPickRaw.charAt(0).toUpperCase() + myPickRaw.slice(1).toLowerCase(),
                enemyPick: enemyPickRaw.charAt(0).toUpperCase() + enemyPickRaw.slice(1).toLowerCase(),
                result: resultElement.value
            };

            matchData.push(payload);
            localStorage.setItem('matchupData', JSON.stringify(matchData));
            
            showStatus(`Successfully logged: ${payload.myPick} vs ${payload.enemyPick}`);
            
            // Reset form except for "My Pick" to streamline sequential entry
            document.getElementById('enemyPick').value = '';
            document.querySelectorAll('input[name="matchResult"]').forEach(rb => rb.checked = false);
            
            // Re-render matrix in the background
            renderMatrix();
        });

        // Event Listener: Data Clearing
        clearBtn.addEventListener('click', function() {
            if (confirm("Are you certain? This will irrevocably delete your localized dataset.")) {
                matchData = [];
                localStorage.removeItem('matchupData');
                renderMatrix();
                showStatus('Dataset cleared.', true);
            }
        });

        // Matrix Generation Logic
        function renderMatrix() {
            if (matchData.length === 0) {
                matrixContainer.innerHTML = '<div class="p-8 text-center text-slate-500 italic">No data logged. The matrix requires input to initialize.</div>';
                return;
            }

            // Extract distinct heroes and sort alphabetically
            const myHeroes = [...new Set(matchData.map(d => d.myPick))].sort();
            const enemyHeroes = [...new Set(matchData.map(d => d.enemyPick))].sort();

            // Construct Table Headers
            let tableHTML = '<table class="w-full border-collapse"><thead><tr>';
            tableHTML += '<th class="sticky top-0 left-0 z-20 bg-slate-300">My Pick \\ Enemy</th>';
            
            enemyHeroes.forEach(hero => {
                tableHTML += `<th class="sticky top-0 z-10 bg-slate-200">${hero}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            // Construct Table Rows
            myHeroes.forEach(myHero => {
                tableHTML += `<tr><th class="sticky left-0 z-10 bg-slate-200 text-left px-4 shadow-[2px_0_5px_rgba(0,0,0,0.05)]">${myHero}</th>`;
                
                enemyHeroes.forEach(enemyHero => {
                    const subset = matchData.filter(d => d.myPick === myHero && d.enemyPick === enemyHero);
                    const totalMatches = subset.length;
                    
                    if (totalMatches === 0) {
                        tableHTML += `<td class="cell-empty">-</td>`;
                    } else {
                        const wins = subset.filter(d => d.result === 'win').length;
                        const winRate = (wins / totalMatches) * 100;
                        
                        let cssClass = 'cell-okay';
                        if (winRate >= 55) cssClass = 'cell-good';
                        if (winRate <= 45) cssClass = 'cell-bad';

                        tableHTML += `<td class="${cssClass}">
                            <div class="text-lg">${Math.round(winRate)}%</div>
                            <div class="text-xs font-normal opacity-75">${wins}W - ${totalMatches - wins}L</div>
                        </td>`;
                    }
                });
                tableHTML += '</tr>';
            });

            tableHTML += '</tbody></table>';
            matrixContainer.innerHTML = tableHTML;
        }

        // Initialize background data
        renderMatrix();
    </script>
</body>
</html>
